services:
  - type: web
    name: voice-agent
    runtime: python
    plan: free
    buildCommand: 'true'
    startCommand: python deployment/browser/server.py
    envVars:
      # sync: false is what makes Render prompt for a value during Blueprint
      # creation. Everything below with a literal value is set for you and can
      # be changed afterwards under Environment on the service.
      - key: ASSEMBLYAI_API_KEY
        sync: false
      # Which agents/<name>.jsonc the service publishes on boot.
      - key: AGENT
        value: campusflow
      # Paste an id from your .env here to serve that exact agent. Left empty,
      # the service publishes AGENT itself and reuses the agent of the same
      # name on later restarts.
      - key: AGENT_ID
        value: agent_513be8ee78684d6b8068521aeb409189

  # CampusFlow tool backend + ops dashboard (Phase 8). Stdlib only, SQLite
  # on the service disk. Free-tier disks are EPHEMERAL: data resets on
  # restart/redeploy, and CAMPUSFLOW_SEED=1 reseeds the deterministic demo
  # dataset on boot when the tickets table is empty. Existing rows are
  # never wiped by a restart.
  - type: web
    name: campusflow-backend
    runtime: python
    plan: free
    buildCommand: 'true'
    startCommand: python backend/server.py
    envVars:
      - key: CAMPUSFLOW_HOST
        value: 0.0.0.0
      - key: CAMPUSFLOW_SEED
        value: '1'
      # PORT is set by Render itself; server.py reads it as fallback.
